name: Test NASA FIRMS API access
on:
  workflow_dispatch:
    inputs:
      mode:
        description: API smoke test, historical pilot, replay, preview or source record export
        type: choice
        default: smoke
        options:
          [
            smoke,
            pilot,
            replay,
            preview,
            records,
            training,
            indicator,
            multiyear,
          ]
      max_new_requests:
        description: New NASA attempt budget for multi-year mode only
        type: string
        default: "416"
      evidence_layout:
        description: Evidence layout for training acquisition or offline replay
        type: choice
        default: solar-preview
        options: [solar-preview, training-period]
      replay_run_id:
        description: Source evidence run ID for replay, preview or records
        type: string
        required: false
  push:
    branches: [main]
    paths: [.github/workflows/firms-smoke.yml]
permissions:
  contents: read
  actions: read
jobs:
  download:
    if: inputs.mode != 'records' && inputs.mode != 'training' && inputs.mode != 'indicator' && inputs.mode != 'multiyear'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned pilot geometry dependency
        if: inputs.mode == 'pilot' || inputs.mode == 'replay' || inputs.mode == 'preview'
        run: python -m pip install shapely==2.2.0
      - name: Run six-request historical pilot
        if: inputs.mode == 'pilot'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python science/scripts/firms_pilot.py --output "$RUNNER_TEMP/firms-pilot"
      - name: Read previous evidence without another NASA request
        if: inputs.mode == 'replay' || inputs.mode == 'preview'
        uses: actions/download-artifact@v4
        with:
          name: firms-pilot-evidence
          path: ${{ runner.temp }}/firms-replay
          run-id: ${{ inputs.replay_run_id }}
          github-token: ${{ github.token }}
      - name: Re-audit previous evidence offline
        if: inputs.mode == 'replay'
        run: python science/scripts/firms_pilot.py --replay "$RUNNER_TEMP/firms-replay" --output "$RUNNER_TEMP/firms-pilot"
      - name: Prepare padded experimental solar calendar
        if: inputs.mode == 'preview'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python science/scripts/solar_preview.py --evidence "$RUNNER_TEMP/firms-replay" --output "$RUNNER_TEMP/firms-solar-preview"
      - name: Retain solar preview evidence
        if: inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: firms-solar-preview-evidence
          path: ${{ runner.temp }}/firms-solar-preview/
          retention-days: 7
          if-no-files-found: error
      - name: Retain offline pilot evidence for review
        if: inputs.mode == 'pilot' || inputs.mode == 'replay'
        uses: actions/upload-artifact@v4
        with:
          name: firms-pilot-evidence
          path: ${{ runner.temp }}/firms-pilot/
          retention-days: 7
          if-no-files-found: error
      - name: Download one historical day inside a small Pantanal bounding box
        if: inputs.mode == '' || inputs.mode == 'smoke'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: >-
          python science/scripts/firms_download.py
          --source MODIS_SP
          --bbox=-57,-19,-56,-18
          --start 2020-08-10
          --days 1
          --output "$RUNNER_TEMP/firms-smoke"
      - name: Summarize response without publishing raw data
        if: inputs.mode == '' || inputs.mode == 'smoke'
        env:
          REVIEW_OUTPUT: ${{ runner.temp }}/firms-smoke
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads((Path(os.environ["REVIEW_OUTPUT"]) / "provenance.json").read_text())
          summary = (
              "## NASA FIRMS API smoke test\n\n"
              f"Source: {metadata['source']}\n\n"
              f"Returned detections: {metadata['row_count']}\n\n"
              f"CSV SHA-256: `{metadata['sha256']}`\n\n"
              "The response schema, dates and bounding box passed validation. "
              "Coverage remains unknown; a zero row count does not establish zero fire. "
              "No public dataset or deployment was changed.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(summary)
          PY
      - name: Remove temporary download
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/firms-smoke" "$RUNNER_TEMP/firms-pilot" "$RUNNER_TEMP/firms-replay" "$RUNNER_TEMP/firms-solar-preview"

  export-records:
    if: inputs.mode == 'records'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install shapely==2.2.0
      - uses: actions/download-artifact@v4
        with:
          name: firms-solar-preview-evidence
          path: ${{ runner.temp }}/solar-evidence
          run-id: ${{ inputs.replay_run_id }}
          github-token: ${{ github.token }}
      - name: Reproduce frozen snapshot and export exact inspection rows offline
        run: >-
          python science/scripts/export_solar_records.py
          --evidence "$RUNNER_TEMP/solar-evidence"
          --preview app/public/data/experimental/v1/pantanal-solar.json
          --output "$RUNNER_TEMP/solar-records"
      - name: Save generated assets on a separate review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf -- app/public/data/experimental/records-v1
          mkdir -p app/public/data/experimental/records-v1
          cp -R "$RUNNER_TEMP/solar-records/." app/public/data/experimental/records-v1/
          git add -- app/public/data/experimental/records-v1
          if git diff --cached --quiet; then
            echo "Generated source records already match the committed snapshot."
            exit 0
          fi
          git commit -m "data: export exact experimental solar detection records"
          git push origin "HEAD:refs/heads/data/solar-records-$GITHUB_RUN_ID"
      - name: Remove temporary evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/solar-evidence" "$RUNNER_TEMP/solar-records"

  training-period:
    if: inputs.mode == 'training'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install shapely==2.2.0
      - name: Load original 2020 evidence or replay both audited years
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.evidence_layout == 'training-period' && 'training-period-evidence' || 'firms-solar-preview-evidence' }}
          path: ${{ runner.temp }}/reference-evidence
          run-id: ${{ inputs.replay_run_id }}
          github-token: ${{ github.token }}
      - name: Acquire bounded 2019 pilot and replay 2020 with identical rules
        if: inputs.evidence_layout != 'training-period'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: >-
          python science/scripts/training_period_pilot.py
          --reference-evidence "$RUNNER_TEMP/reference-evidence"
          --output "$RUNNER_TEMP/training-period-evidence"
      - name: Replay both periods without a FIRMS key
        if: inputs.evidence_layout == 'training-period'
        run: >-
          python science/scripts/training_period_pilot.py
          --reference-evidence "$RUNNER_TEMP/reference-evidence"
          --output "$RUNNER_TEMP/training-period-evidence"
      - name: Retain original CSVs, lineage and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: training-period-evidence
          path: ${{ runner.temp }}/training-period-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/reference-evidence" "$RUNNER_TEMP/training-period-evidence"
  publish-training-report:
    if: inputs.mode == 'training' && inputs.evidence_layout != 'training-period'
    needs: training-period
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: training-period-evidence
          path: ${{ runner.temp }}/training-period-evidence
      - name: Save sanitized reports on a separate review branch
        run: |
          mkdir -p docs/training-period-audit
          cp "$RUNNER_TEMP/training-period-evidence/2019/audit.json" docs/training-period-audit/2019-august-summary.json
          cp "$RUNNER_TEMP/training-period-evidence/2020/audit.json" docs/training-period-audit/2020-august-summary.json
          cp "$RUNNER_TEMP/training-period-evidence/readiness.json" docs/training-period-audit/readiness.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/training-period-audit
          if git diff --cached --quiet; then
            echo "Training period reports already match."
            exit 0
          fi
          git commit -m "data: record bounded 2019 acquisition and same-rule 2020 audit"
          git push origin "HEAD:refs/heads/data/training-audit-$GITHUB_RUN_ID"
      - name: Remove temporary evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/training-period-evidence"

  indicator-observations:
    if: inputs.mode == 'indicator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install shapely==2.2.0
      - uses: actions/download-artifact@v4
        with:
          name: training-period-evidence
          path: ${{ runner.temp }}/indicator-source-evidence
          run-id: ${{ inputs.replay_run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild observed indicators offline without a FIRMS key
        run: >-
          python science/scripts/build_indicator_observations.py
          --evidence "$RUNNER_TEMP/indicator-source-evidence"
          --output "$RUNNER_TEMP/observed-indicator-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: observed-indicator-evidence
          path: ${{ runner.temp }}/observed-indicator-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Remove temporary evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/indicator-source-evidence" "$RUNNER_TEMP/observed-indicator-evidence"
  publish-indicator-observations:
    if: inputs.mode == 'indicator'
    needs: indicator-observations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: observed-indicator-evidence
          path: ${{ runner.temp }}/observed-indicator-evidence
      - name: Publish observed audit products only to a review branch
        run: |
          mkdir -p docs/indicator-observations docs/thresholds-evidence
          cp "$RUNNER_TEMP/observed-indicator-evidence/2019/observations.json" docs/indicator-observations/2019-observations.json
          cp "$RUNNER_TEMP/observed-indicator-evidence/2020/observations.json" docs/indicator-observations/2020-observations.json
          cp "$RUNNER_TEMP/observed-indicator-evidence/summary.json" docs/indicator-observations/summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/observed-indicator-evidence/scientific-validation/validation/summary.json" docs/thresholds-evidence/current-readiness.json
          cp "$RUNNER_TEMP/observed-indicator-evidence/scientific-validation/manifest.json" docs/thresholds-evidence/manifest.json
          git add -- docs/indicator-observations docs/thresholds-evidence
          if git diff --cached --quiet; then
            echo "Observed indicator products already match."
            exit 0
          fi
          git commit -m "data: record post-quality deduplicated observed turn aggregates"
          git push origin "HEAD:refs/heads/data/indicator-methods-$GITHUB_RUN_ID"
      - name: Remove temporary evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/observed-indicator-evidence"

  multiyear:
    if: inputs.mode == 'multiyear'
    uses: ./.github/workflows/scientific-pipeline.yml
    with:
      resume_run_id: ${{ inputs.replay_run_id || '' }}
      max_new_requests: ${{ inputs.max_new_requests || '416' }}
    secrets: inherit
